      - professional
      - concise
      - persuasive
      - others

  - name: "domain"
    description: "The primary subject area or task category where the user seeks assistance, defining the scope of their needs."
    type: "categorical"
    category: "basic_info"
    is_constraint: false
    values:
      - general
      - writing
      - coding
      - data
      - product
      - design
      - marketing
      - sales
      - customer_support
      - bizdev
